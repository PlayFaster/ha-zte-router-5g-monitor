# IQS compliance tracking for ZTE Router 5G Monitor
# Generated on 2026-05-07 v1.0.1
# Generated on 2026-05-13 v1.1.0
rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment:
      Show-form paths added for both async_step_user and async_step_init; options flow
      ZTEAuthError branch tested. All config flow error branches covered.
  config-flow:
    status: done
    comment:
      data_description entries added in strings.json for host and password in both
      config and options flow steps.
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment:
      No custom condition platform — no condition.py, conditions.yaml, or conditions
      block in strings.json. The integration exposes sensors and actions only.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment:
      No custom trigger platform — no trigger.py, triggers.yaml, or triggers block in
      strings.json. The zte_router_5g_sms_received bus event is documented in the README
      but is an event, not a trigger platform, so it does not change this.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: done
    comment:
      Migrated from hass.data[DOMAIN][entry.entry_id] to entry.runtime_data in
      __init__.py and all five platform files.
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment:
      Both ZTERebootButton and ZTEDeleteAllSMSButton async_press handlers now raise
      HomeAssistantError on failure so automations can detect button failures.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: done
    comment:
      README now includes polling interval range (30-3600 s), defaults, and runtime
      options flow parameters in a documented table.
  docs-installation-parameters:
    status: done
    comment:
      README documents minimum HA version (2024.6.0) and tested firmware version (MC7010
      V1.0.0B01 and later).
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: done
    comment:
      Coordinator now logs WARNING once on first failure, DEBUG for intermediate retries
      (2/3, 3/3), ERROR on transition to unavailable, and INFO on reconnection. No
      longer spams the log on every retry cycle.
  parallel-updates:
    status: done
    comment:
      Set deliberately per platform. PARALLEL_UPDATES = 0 on the read-only platforms
      (sensor, binary_sensor) — coordinator-driven, so there is no per-entity polling to
      serialise. PARALLEL_UPDATES = 1 on the platforms that command the router (switch,
      select, number, button) the router permits a single session, so concurrent goform
      writes are how a session gets torn down. Rapid toggling queues rather than racing.
  reauthentication-flow:
    status: done
    comment:
      async_step_reauth and async_step_reauth_confirm added to config_flow.py;
      coordinator triggers reauth on ZTEAuthError via entry.async_start_reauth;
      strings.json updated with reauth section.
  test-coverage: done

  # Gold
  devices: done
  diagnostics:
    status: done
    comment:
      diagnostics.py implements async_get_config_entry_diagnostics with a layered
      sanitizer, not key-name redaction alone — the coordinator payload is the vendor
      goform response stored verbatim. Credentials, subscriber identifiers and carrier
      identity are blanked; IPs, cell identifiers and SMS senders become stable
      pseudonyms (ip-1, cell-2, phone-1); APN profiles are reduced to their shape; and
      anything IP- or MAC-shaped is swept structurally for keys not enumerated. The SMS
      body and sender do not survive. Includes entry data, coordinator state, health
      snapshot and endpoint failure counts.
  discovery-update-info:
    status: exempt
    comment: Depends on discovery, which is exempt for this fixed-IP integration.
  discovery:
    status: exempt
    comment:
      Fixed-IP polling integration; router requires credentials so discovery would save
      only the IP entry step.
  docs-data-update:
    status: done
    comment:
      README section 'Technical Architecture & Resilience' explicitly documents the
      3-strike resilience logic and the Pause Polling behavior.
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: done
    comment:
      README section 'Compatibility & Tested Devices' now lists explicitly tested
      hardware models and firmware versions, plus expected compatible models.
  docs-supported-functions:
    status: done
    comment:
      README section 'Entity Overview' provides a structured summary of every entity by
      sub-device and metric type, naming which are disabled by default. The
      authoritative inventory is docs/all_sensors.md kept current against live HA by
      sensor_review.
  docs-troubleshooting:
    status: done
    comment:
      README section 'FAQ & Troubleshooting' covers common connectivity issues, unknown
      sensors, and simultaneous login conflicts.
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment:
      No device tracker platform; static sub-device architecture
      (System/Signal/Data/SMS) is complete and does not require dynamic device handling.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations:
    status: done
    comment:
      All entities across the six platforms (sensor, binary_sensor, button, number,
      switch, select) use a prefixed translation_key (system_, signal_, data_ or sms_)
      matching their sub-device group. 77 keys, every one resolving in both strings.json
      and translations/en.json with no stale entries — reconciled against the code
      rather than by comparing the two files to each other.
  exception-translations:
    status: done
    comment:
      Config flow errors are translated via strings.json, and all nine user-facing
      raises now carry translation_domain + translation_key with an exceptions block in
      strings.json and translations/en.json. Seven are in __init__.py (four SMS service
      handlers plus three coordinator target-resolution failures) and two in button.py
      (reboot, delete all SMS). The three target-resolution failures use
      ServiceValidationError rather than HomeAssistantError — they are faults in how the
      action was called, which the user can correct. Guarded by
      test_every_raised_exception_has_translated_text, which fails on any untranslated
      raise or any key missing from either file.
  icon-translations:
    status: done
    comment:
      icons.json covers entities and services. All entity translation_keys have an entry
      except system_uptime_duration, which derives its icon from
      SensorDeviceClass.DURATION; best_connection and integration_health use state-
      dependent icons. The services block covers all four SMS actions.
  reconfiguration-flow:
    status: done
    comment:
      Implemented async_step_reconfigure in config_flow.py using
      self._get_reconfigure_entry() and self.async_update_reload_and_abort as per modern
      HA standards. strings.json updated with reconfigure step.
  repair-issues:
    status: done
    comment:
      Two repairs, both translated in strings.json and en.json, matching the family-wide
      set agreed in x_project/repair_set_alignment.md on 2026-08-25.
      _set_unreachable_repair raises conn_error after UNREACHABLE_STRIKE_LIMIT (10)
      consecutive failed fetches — well above the 3-strike unavailability threshold, so
      a router reboot never reaches it; it auto-clears on the next good poll.
      _set_auth_repair raises auth_failed when the router rejects the credentials,
      is_fixable=True and is_persistent=True, with repairs.py giving its Fix button a
      flow that starts the reauth the card promises. Without that module HA substitutes
      ConfirmRepairFlow, whose Fix button deletes the card without touching the
      credentials. A lapsed session is not this — only ZTECredentialsError reaches it.
      Three conditions were assessed against the same rule and deliberately do NOT raise
      a repair, because the user cannot act on them in that panel. Contract drift and
      degraded capabilities publish on the Integration Health sensor, and a full message
      store on binary_sensor.*_sms_storage_full. Their retired ids are swept at setup
      and at removal via RETIRED_REPAIR_NAMES, so no card is left stranded.
  stale-devices:
    status: exempt
    comment:
      Nothing here can become stale. The four sub-devices (System, Signal, Data, SMS)
      are created from a fixed group list on every setup, and the integration never
      enumerates clients behind the router — it monitors the CPE itself, not the LAN.
      Replacing the router yields a new IMEI and therefore a new config entry, whose
      removal takes its devices with it. This is N/A rather than the family-level REJECT
      ("devices persist intentionally") — there is no removal policy to decline, because
      no device can ever be orphaned. NOTE — that ceases to be true if dev_standards
      Section 15 feature-group toggles are implemented, since disabling the SMS group
      would orphan its sub-device and a cleanup path would be required.

  # Platinum
  async-dependency:
    status: done
    comment:
      Native aiohttp API client (api.py) with no executor wrapping; overrides the
      family-level N/A verdict which assumed a synchronous external library.
  inject-websession:
    status: done
    comment:
      HA's aiohttp session injected via async_get_clientsession in __init__.py and
      passed to ZTERouterAPI; overrides the family-level N/A verdict.
  strict-typing: done
