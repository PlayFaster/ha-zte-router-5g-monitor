---
# IQS compliance tracking for ZTE Router 5G Monitor
# Generated on 2026-05-07 v1.0.1
rules:
  # Bronze
  action-setup:
    status: exempt
    comment:
      No service actions in this integration; reboot and SMS deletion use HA button
      entities, not service calls.
  appropriate-polling:
    status: exempt
    comment:
      User-configurable polling interval via Number entity is intentional; departs from
      IQS conservative polling guidance.
  brands:
    status: exempt
    comment:
      Custom component distributed via HACS; not submitted to the HA brands repository.
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment:
      Show-form paths added for both async_step_user and async_step_init; options flow
      ZTEAuthError branch tested. All config flow error branches covered.
  config-flow:
    status: done
    comment:
      data_description entries added in strings.json for host and password in both
      config and options flow steps.
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment:
      No service actions registered; buttons are HA button entities, not service calls.
      Nothing to document.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: done
    comment:
      Migrated from hass.data[DOMAIN][entry.entry_id] to entry.runtime_data in
      __init__.py and all five platform files.
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: done
    comment:
      Both ZTERebootButton and ZTEDeleteAllSMSButton async_press handlers now raise
      HomeAssistantError on failure so automations can detect button failures.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: done
    comment:
      README now includes polling interval range (30-3600 s), defaults, and runtime
      options flow parameters in a documented table.
  docs-installation-parameters:
    status: done
    comment:
      README now documents minimum HA version (2024.6.0), Python version (3.12+), and
      tested firmware versions.
  entity-unavailable: done
  integration-owner:
    status: exempt
    comment:
      Personal project; codeowners field present in manifest.json as good practice.
  log-when-unavailable:
    status: done
    comment:
      Coordinator now logs WARNING once on first failure, DEBUG for intermediate retries
      (2/3, 3/3), ERROR on transition to unavailable, and INFO on reconnection. No
      longer spams the log on every retry cycle.
  parallel-updates:
    status: done
    comment:
      PARALLEL_UPDATES = 0 added to all five platform files (sensor, binary_sensor,
      button, switch, number).
  reauthentication-flow:
    status: done
    comment:
      async_step_reauth and async_step_reauth_confirm added to config_flow.py;
      coordinator triggers reauth on ZTEAuthError via entry.async_start_reauth;
      strings.json updated with reauth section.
  test-coverage: done

  # Gold
  devices: done
  diagnostics:
    status: done
    comment:
      diagnostics.py created with async_get_config_entry_diagnostics; redacts sensitive
      fields (password, username, IPs); includes entry data, coordinator state, and live
      router data.
  discovery-update-info:
    status: exempt
    comment: Depends on discovery, which is exempt for this fixed-IP integration.
  discovery:
    status: exempt
    comment:
      Fixed-IP polling integration; router requires credentials so discovery would save
      only the IP entry step.
  docs-data-update:
    status: done
    comment:
      README section 'Technical Architecture & Resilience' explicitly documents the
      3-strike resilience logic and the Pause Polling behavior.
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices:
    status: done
    comment:
      README section 'Compatibility & Tested Devices' now lists explicitly tested
      hardware models and firmware versions, plus expected compatible models.
  docs-supported-functions:
    status: done
    comment:
      README section 'Entity Overview' provides a structured breakdown of all 51+
      entities by sub-device and metric type.
  docs-troubleshooting:
    status: done
    comment:
      README section 'FAQ & Troubleshooting' covers common connectivity issues, unknown
      sensors, and simultaneous login conflicts.
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment:
      No device tracker platform; static sub-device architecture
      (System/Signal/Data/SMS) is complete and does not require dynamic device handling.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations:
    status: done
    comment:
      All platform entities (sensor, binary_sensor, button, switch, number) use prefixed
      translation_key (system_, signal_, data_, or sms_) matching their respective
      sub-device group. strings.json and en.json are fully synchronized and include all
      51 entities.
  exception-translations:
    status: done
    comment:
      Config flow errors (cannot_connect, invalid_auth, unknown, already_configured) are
      translated via strings.json. No custom service exceptions required.
  icon-translations:
    status: todo
    comment:
      No icons.json file; entity icons are hardcoded in descriptions;
      BestConnectionSensor uses a property override for state-dependent icons.
  reconfiguration-flow:
    status: done
    comment:
      Implemented async_step_reconfigure in config_flow.py using
      self._get_reconfigure_entry() and self.async_update_reload_and_abort as per modern
      HA standards. strings.json updated with reconfigure step.
  repair-issues:
    status: todo
    comment:
      Low priority; consider for SMS storage full or firmware incompatibility detection.
  stale-devices:
    status: exempt
    comment:
      Devices persist intentionally; users control removal via the device registry.

  # Platinum
  async-dependency:
    status: done
    comment:
      Native aiohttp API client (api.py) with no executor wrapping; overrides the
      family-level N/A verdict which assumed a synchronous external library.
  inject-websession:
    status: done
    comment:
      HA's aiohttp session injected via async_get_clientsession in __init__.py and
      passed to ZTERouterAPI; overrides the family-level N/A verdict.
  strict-typing: done
