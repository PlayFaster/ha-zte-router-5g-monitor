# SYNCED FILE — edit dev-workbench/workbench/python/setup.cfg and re-sync.
# The sync appends the project's .validate/mutmut_modules.txt to only_mutate.
# Background and traps: info/test_better_docs/mutation_testing_setup.md

[mutmut]
source_paths=custom_components

do_not_mutate_patterns=
    _LOGGER\.\w+

# Both lines needed: the first watches the tests, the second re-runs on a
# change. Without them a test-only change leaves stale verdicts cached.
cache_invalidation_files=
    tests/*.py

on_dependency_change=rerun

# `also_copy` ensures non-source assets (scripts/ and component artifacts
# appended during sync) are refreshed in mutants/ on every run.
also_copy=
    scripts/
    custom_components/zte_router_5g/icons.json
    custom_components/zte_router_5g/strings.json
    custom_components/zte_router_5g/services.yaml
    custom_components/zte_router_5g/quality_scale.yaml
    custom_components/zte_router_5g/translations

# Newline-separated and indented. A comma-separated list matches nothing.
only_mutate=
    */helpers.py
    */diagnostics.py
    */sensor.py
