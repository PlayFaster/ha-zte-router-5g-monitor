name: Validate

"on":
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *" # Daily at midnight

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # Branch @main v2.0.6 — update SHA after pushing .github changes
    uses: PlayFaster/.github/.github/workflows/validate.yaml@e604ffdf9041f085834e635faecd428c78fe8d6a
    with:
      category: integration
      component_name: zte_router_5g
      gist_id: 0376d580e72d0abc493665a80396f701
    secrets:
      GIST_SECRET: ${{ secrets.GIST_SECRET }}
