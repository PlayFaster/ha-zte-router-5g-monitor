name: Validate

"on":
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *" # Daily at midnight

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # Branch @main v2.0.5 — update SHA after pushing .github changes
    uses: PlayFaster/.github/.github/workflows/validate.yaml@00f1aed621398239f2258d739f2b8428cfd4cd96
    with:
      category: integration
      component_name: zte_router_5g
      gist_id: 0376d580e72d0abc493665a80396f701
    secrets:
      GIST_SECRET: ${{ secrets.GIST_SECRET }}
