name: Release

"on":
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write # Required to upload the HACS zip as a release asset
    # Branch @main — update SHA after pushing .github changes v2.0.15
    uses: PlayFaster/.github/.github/workflows/release.yaml@b2242c0d3734f53d4da2709b8da7ae50a480843a
    with:
      component_name: zte_router_5g
      tag: ${{ github.event.release.tag_name }}
