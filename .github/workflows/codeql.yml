---
name: CodeQL

"on":
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    permissions:
      contents: read
      security-events: write
    # Branch @main — replace SHA after releasing .github repo with codeql.yaml
    uses: PlayFaster/.github/.github/workflows/codeql.yaml@f791928e836c700bd2197b0481782cca8e0d21c4
